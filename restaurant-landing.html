<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>قصر الأغا | أصل الأكل الشامي في ادفو</title>
    <meta
      name="description"
      content="قصر الأغا - أصل الأكل الشامي في ادفو. شاورما ومشاوي وأرز شامي. تصفح المنيو واطلب أونلاين."
    />
    <meta property="og:title" content="قصر الأغا | أصل الأكل الشامي في ادفو" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500&family=Inter:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Restaurant",
        "name": "قصر الأغا",
        "servesCuisine": "Levantine",
        "telephone": "+201115192896",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "شارع المركز - أمام بوابة مركز الشرطة",
          "addressLocality": "ادفو",
          "addressCountry": "EG"
        }
      }
    </script>
    <style>
      :root {
        --gold: #d6a52a;
        --lgold: #e5bc52;
        --brown: #351515;
        --burg: #4a1718;
        --cream: #f4e7b5;
        --beige: #ead58b;
        --text: #2a1712;
        --white: #fff9e8;
        --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      :root {
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-behavior: smooth;
        scroll-padding-top: 120px;
      }
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }
      body {
        margin: 0;
        background: var(--gold);
        color: var(--text);
        font:
          500 16px/1.6 Tajawal,
          Cairo,
          sans-serif;
        overflow-x: hidden;
      }
      [lang="en"] body,
      [lang="en"] button,
      [lang="en"] input,
      [lang="en"] textarea {
        font-family: Inter, sans-serif;
      }
      h1,
      h2,
      h3,
      button,
      .price {
        font-family: Cairo, Inter, sans-serif;
      }
      button {
        font: inherit;
        cursor: pointer;
        border: 0;
        color: inherit;
        background: none;
      }
      img,
      svg {
        max-width: 100%;
      }
      :focus-visible {
        outline: 3px solid var(--white);
        outline-offset: 2px;
        box-shadow: 0 0 0 5px var(--brown);
      }
      .wrap {
        width: min(1180px, 100% - 32px);
        margin-inline: auto;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 48px;
        padding: 0 26px;
        border-radius: 99px;
        font-weight: 700;
        transition:
          transform 0.2s var(--ease),
          background 0.2s;
      }
      .btn:active {
        transform: scale(0.96);
      }
      .btn-dark {
        background: var(--brown);
        color: var(--cream);
      }
      .btn-dark:hover {
        background: var(--burg);
        transform: translateY(-2px);
      }
      .btn-line {
        border: 2.5px solid var(--brown);
        color: var(--brown);
      }
      .btn-line:hover {
        background: var(--brown);
        color: var(--cream);
      }

      /* header */
      header {
        position: sticky;
        top: 0;
        z-index: 30;
        background: var(--burg);
        color: var(--cream);
        transition:
          padding 0.3s,
          box-shadow 0.3s,
          background 0.3s;
        padding: 18px 0;
      }
      header.small {
        padding: 8px 0;
        background: var(--brown);
        box-shadow: 0 6px 18px #0005;
      }
      .nav {
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .logo {
        font: 900 22px Cairo;
        color: var(--lgold);
        margin-inline-end: auto;
        text-decoration: none;
      }
      .links {
        display: flex;
        gap: 6px;
      }
      .links a {
        color: var(--cream);
        text-decoration: none;
        font-weight: 700;
        padding: 8px 14px;
        border-radius: 99px;
      }
      .links a:hover {
        background: #ffffff1c;
      }
      .pill {
        min-height: 44px;
        min-width: 44px;
        padding: 0 16px;
        border-radius: 99px;
        background: var(--lgold);
        color: var(--brown);
        font-weight: 800;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        justify-content: center;
      }
      .pill.ghost {
        background: none;
        border: 2px solid var(--lgold);
        color: var(--lgold);
      }
      .count {
        background: var(--brown);
        color: var(--cream);
        border-radius: 99px;
        min-width: 22px;
        height: 22px;
        font-size: 13px;
        display: grid;
        place-items: center;
        padding: 0 5px;
      }
      .burger {
        display: none;
      }
      @media (max-width: 820px) {
        .links {
          display: none;
          position: absolute;
          inset-inline: 0;
          top: 100%;
          background: var(--brown);
          flex-direction: column;
          padding: 12px 16px;
        }
        .links.open {
          display: flex;
        }
        .links a {
          padding: 14px;
        }
        .burger {
          display: inline-grid;
        }
      }

      /* hero */
      .hero {
        position: relative;
        overflow: hidden;
        padding: 48px 0 90px;
      }
      .hero .wrap {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 30px;
        align-items: center;
      }
      .hero h1 {
        font-size: clamp(40px, 7vw, 84px);
        line-height: 1.05;
        font-weight: 900;
        margin: 0 0 16px;
        color: var(--brown);
        animation: up 0.8s var(--ease) both;
      }
      .hero p {
        font-size: clamp(17px, 2.2vw, 21px);
        max-width: 30em;
        margin: 0 0 28px;
        animation: up 0.8s 0.12s var(--ease) both;
      }
      .ctas {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        animation: up 0.8s 0.24s var(--ease) both;
      }
      .plate {
        position: relative;
        aspect-ratio: 1;
        width: min(440px, 100%);
        margin-inline: auto;
        animation: pop 1s 0.1s var(--ease) both;
      }
      .plate::before {
        content: "";
        position: absolute;
        inset: 6%;
        border-radius: 50%;
        background: var(--burg);
        box-shadow: 0 30px 50px #35151566;
      }
      .plate::after {
        content: "";
        position: absolute;
        inset: 14%;
        border-radius: 50%;
        border: 4px dashed var(--lgold);
      }
      .plate b {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: clamp(130px, 26vw, 230px);
        font-weight: 400;
        filter: drop-shadow(0 14px 10px #0006);
      }
      .plate i {
        position: absolute;
        font-style: normal;
        font-size: 46px;
        animation: fl 5s ease-in-out infinite;
      }
      .plate i:nth-of-type(1) {
        top: 2%;
        inset-inline-start: 6%;
      }
      .plate i:nth-of-type(2) {
        bottom: 6%;
        inset-inline-end: 2%;
        animation-delay: -2s;
      }
      .plate i:nth-of-type(3) {
        top: 44%;
        inset-inline-end: -2%;
        animation-delay: -3.5s;
        font-size: 34px;
      }
      .hero::after {
        content: "";
        position: absolute;
        inset-inline: -10%;
        bottom: -70px;
        height: 130px;
        background: var(--cream);
        border-radius: 50% 50% 0 0/100% 100% 0 0;
      }
      @keyframes up {
        from {
          opacity: 0;
          transform: translateY(24px);
        }
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
      }
      @keyframes fl {
        50% {
          transform: translateY(-12px) rotate(8deg);
        }
      }
      @media (max-width: 760px) {
        .hero .wrap {
          grid-template-columns: 1fr;
          text-align: center;
        }
        .hero p {
          margin-inline: auto;
        }
        .ctas {
          justify-content: center;
        }
        .plate {
          width: min(300px, 80%);
          order: -1;
        }
      }

      /* menu */
      .menu {
        background: var(--cream);
        padding: 30px 0 120px;
      }
      .sec-title {
        font: 900 clamp(30px, 5vw, 46px)/1.2 Cairo;
        color: var(--brown);
        margin: 0 0 6px;
      }
      .tools {
        position: sticky;
        top: 64px;
        z-index: 20;
        background: var(--cream);
        padding: 12px 0;
        transition: top 0.3s;
      }
      header.small ~ main .tools {
        top: 56px;
      }
      .search {
        width: 100%;
        min-height: 50px;
        border-radius: 99px;
        border: 2.5px solid var(--brown);
        background: var(--white);
        padding: 0 22px;
        font: inherit;
        color: var(--text);
        margin-bottom: 12px;
      }
      .tabs {
        display: flex;
        gap: 10px;
        overflow-x: auto;
        padding: 4px 2px 8px;
        scrollbar-width: none;
      }
      .tabs::-webkit-scrollbar {
        display: none;
      }
      .tab {
        flex: none;
        min-height: 44px;
        padding: 0 20px;
        border-radius: 99px;
        background: var(--beige);
        font-weight: 700;
        color: var(--brown);
        transition:
          background 0.25s,
          color 0.25s;
      }
      .tab[aria-pressed="true"] {
        background: var(--brown);
        color: var(--lgold);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 18px;
        margin-top: 14px;
      }
      .card {
        background: var(--white);
        border-radius: 26px 26px 26px 6px;
        overflow: hidden;
        box-shadow: 0 6px 0 var(--beige);
        display: flex;
        flex-direction: column;
        text-align: start;
        animation: up 0.4s var(--ease) both;
        animation-delay: calc(var(--i) * 35ms);
        transition: transform 0.2s var(--ease);
      }
      .card:hover {
        transform: translateY(-4px);
      }
      .card .img {
        height: 150px;
        display: grid;
        place-items: center;
        font-size: 84px;
        background: radial-gradient(
          circle at 50% 60%,
          var(--lgold) 0 38%,
          var(--beige) 39%
        );
        position: relative;
      }
      .badge {
        position: absolute;
        top: 10px;
        inset-inline-start: 10px;
        background: var(--burg);
        color: var(--cream);
        font: 700 12px Cairo;
        padding: 3px 12px;
        border-radius: 99px;
      }
      .card .body {
        padding: 14px 16px 16px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        flex: 1;
      }
      .card h3 {
        margin: 0;
        font-size: 19px;
        color: var(--brown);
        line-height: 1.3;
      }
      .card p {
        margin: 0;
        font-size: 14.5px;
        opacity: 0.8;
        flex: 1;
      }
      .foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 10px;
      }
      .price {
        font-weight: 800;
        font-size: 20px;
        color: var(--burg);
      }
      .add {
        background: var(--brown);
        color: var(--cream);
        width: 44px;
        height: 44px;
        border-radius: 50%;
        font-size: 24px;
        font-weight: 700;
        line-height: 1;
        transition: transform 0.2s;
        animation: addPulse 1.8s ease-in-out infinite;
      }
      .add:hover {
        transform: rotate(90deg);
      }
      @keyframes addPulse {
        50% { box-shadow: 0 0 0 6px #d6a52a55; }
      }
      .empty {
        grid-column: 1/-1;
        text-align: center;
        padding: 50px 10px;
        font: 700 20px Cairo;
        color: var(--burg);
      }
      .sub {
        margin: 0 0 10px;
        font-weight: 700;
        color: var(--burg);
      }
      #popw { margin: 8px 0 18px; }
      .popular-items {
        display: flex;
        gap: 12px;
        overflow-x: auto;
        padding: 7px 3px 14px;
        scrollbar-width: thin;
        scrollbar-color: var(--gold) transparent;
      }
      .popular-card {
        flex: 0 0 215px;
        min-height: 104px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 15px;
        text-align: start;
        color: var(--cream);
        background: var(--brown);
        border: 2px solid var(--gold);
        border-radius: 42px 18px 42px 18px;
        box-shadow: 0 5px 0 var(--beige);
        transition: transform .2s var(--ease);
      }
      .popular-card:hover { transform: translateY(-3px) rotate(-1deg); }
      .popular-card .popular-thumb {
        flex: 0 0 72px;
        width: 72px;
        height: 72px;
        display: block;
        border: 2px solid var(--lgold);
        border-radius: 50% 50% 44% 44%;
        background-color: var(--beige);
        background-size: cover;
        background-position: center;
        box-shadow: 0 0 0 4px #ffffff1c;
      }
      .popular-card strong { display: block; color: var(--lgold); font-family: Cairo, Inter, sans-serif; }
      .popular-card small { display: block; }
      @media (max-width: 520px) {
        .grid {
          grid-template-columns: 1fr;
        }
        .card {
          flex-direction: row;
          border-radius: 20px 20px 20px 6px;
        }
        .card .img {
          width: 112px;
          height: auto;
          font-size: 54px;
          flex: none;
        }
        .card h3 {
          font-size: 17px;
        }
      }

      /* about/contact/footer */
      .about {
        background: var(--burg);
        color: var(--cream);
        padding: 70px 0;
      }
      .about .wrap {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 40px;
        align-items: center;
      }
      .about h2 {
        font: 900 clamp(28px, 4vw, 42px) Cairo;
        color: var(--lgold);
        margin: 0 0 12px;
      }
      .about .big {
        font-size: 140px;
        text-align: center;
        line-height: 1;
        filter: drop-shadow(0 12px 0 #0004);
      }
      .contact {
        background: var(--gold);
        padding: 60px 0;
      }
      .cgrid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
        margin-top: 20px;
      }
      .cgrid div {
        background: var(--cream);
        border-radius: 22px;
        padding: 18px 20px;
      }
      .cgrid b {
        display: block;
        font-family: Cairo;
        color: var(--burg);
      }
      footer {
        background: var(--brown);
        color: var(--beige);
        padding: 28px 0 100px;
        text-align: center;
        font-size: 14px;
      }
      @media (max-width: 700px) {
        .about .wrap {
          grid-template-columns: 1fr;
        }
        .about .big {
          font-size: 90px;
        }
      }

      /* overlays */
      .scrim {
        position: fixed;
        inset: 0;
        background: #2a171299;
        z-index: 50;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s;
      }
      .scrim.on {
        opacity: 1;
        pointer-events: auto;
      }
      .sheet {
        position: fixed;
        z-index: 60;
        background: var(--white);
        color: var(--text);
        transition:
          transform 0.35s var(--ease),
          opacity 0.25s;
        overflow: auto;
      }
      #modal {
        inset-inline: 0;
        bottom: 0;
        max-height: 92dvh;
        border-radius: 28px 28px 0 0;
        transform: translateY(100%);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      #modal.on {
        transform: none;
      }
      @media (min-width: 700px) {
        #modal {
          inset: 50% auto auto 50%;
          width: min(480px, 92vw);
          border-radius: 28px;
          transform: translate(-50%, -46%);
          opacity: 0;
          pointer-events: none;
        }
        #modal.on {
          transform: translate(-50%, -50%);
          opacity: 1;
          pointer-events: auto;
        }
      }
      #drawer {
        top: 0;
        bottom: 0;
        inset-inline-end: 0;
        width: min(440px, 100%);
        display: flex;
        flex-direction: column;
        transform: translateX(100%);
      }
      [dir="rtl"] #drawer {
        transform: translateX(-100%);
      }
      #drawer.on {
        transform: none;
      }
      .mhead {
        height: 190px;
        display: grid;
        place-items: center;
        font-size: 110px;
        background: radial-gradient(
          circle at 50% 60%,
          var(--lgold) 0 40%,
          var(--beige) 41%
        );
      }
      .mbody {
        padding: 18px 22px 24px;
        display: grid;
        gap: 12px;
      }
      .mbody h2 {
        margin: 0;
        font-size: 26px;
        color: var(--brown);
      }
      .x {
        position: absolute;
        top: 12px;
        inset-inline-end: 12px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: var(--brown);
        color: var(--cream);
        font-size: 22px;
        z-index: 2;
      }
      .qty {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--cream);
        border-radius: 99px;
        padding: 4px;
      }
      .qty button {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--brown);
        color: var(--cream);
        font-size: 20px;
      }
      .qty span {
        min-width: 30px;
        text-align: center;
        font-weight: 800;
      }
      .opt {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 14px;
        background: var(--cream);
        border-radius: 14px;
        cursor: pointer;
      }
      .opt-photo {
        display: inline-block;
        vertical-align: middle;
        width: 38px;
        height: 38px;
        margin-inline-end: 7px;
        border-radius: 12px;
        background-size: cover;
        background-position: center;
        border: 1px solid var(--beige);
      }
      .opt input {
        accent-color: var(--brown);
        width: 20px;
        height: 20px;
      }
      textarea,
      .in {
        width: 100%;
        border: 2px solid var(--beige);
        border-radius: 14px;
        padding: 12px 14px;
        font: inherit;
        background: #fff;
        color: var(--text);
      }
      label.f {
        display: grid;
        gap: 4px;
        font-weight: 700;
      }
      .dh {
        background: var(--burg);
        color: var(--cream);
        padding: 18px 22px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .dh h2 {
        margin: 0;
        font-size: 22px;
      }
      .dh button {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--lgold);
        color: var(--brown);
        font-size: 20px;
      }
      .db {
        flex: 1;
        overflow: auto;
        padding: 16px 20px;
        display: grid;
        gap: 12px;
        align-content: start;
      }
      .ci {
        display: grid;
        grid-template-columns: 56px 1fr auto;
        gap: 12px;
        align-items: center;
        background: var(--cream);
        border-radius: 18px;
        padding: 10px;
      }
      .ci .e {
        font-size: 34px;
        text-align: center;
        background: var(--lgold);
        border-radius: 14px;
        height: 56px;
        display: grid;
        place-items: center;
      }
      .ci h4 {
        margin: 0;
        font: 700 16px Cairo;
      }
      .ci small {
        display: block;
        opacity: 0.75;
      }
      .rm {
        color: var(--burg);
        font-weight: 700;
        font-size: 13px;
        text-decoration: underline;
        padding: 6px 0;
      }
      .df {
        padding: 16px 20px calc(16px + env(safe-area-inset-bottom, 0px));
        background: var(--cream);
        display: grid;
        gap: 8px;
      }
      .row {
        display: flex;
        justify-content: space-between;
      }
      .row.t {
        font: 800 20px Cairo;
        color: var(--burg);
      }
      .seg {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .seg label {
        text-align: center;
        padding: 12px;
        border: 2px solid var(--beige);
        border-radius: 14px;
        cursor: pointer;
        font-weight: 700;
      }
      .seg input {
        position: absolute;
        opacity: 0;
      }
      .seg label:has(input:checked) {
        background: var(--brown);
        color: var(--lgold);
        border-color: var(--brown);
      }
      .ok {
        text-align: center;
        padding: 10px 0;
        display: grid;
        gap: 10px;
      }
      .ok .e {
        font-size: 70px;
      }
      .fab {
        position: fixed;
        inset-inline: 16px;
        bottom: calc(16px + env(safe-area-inset-bottom, 0px));
        z-index: 25;
        display: none;
        justify-content: space-between;
        padding: 0 22px;
        min-height: 56px;
        box-shadow: 0 10px 24px #0006;
      }
      @media (max-width: 820px) {
        .fab.has {
          display: flex;
        }
      }

      .logo img {
        height: 56px;
        display: block;
        transition: height 0.3s;
      }
      header.small .logo img {
        height: 42px;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
      }
      .hero2 {
        background: var(--burg);
        padding-bottom: 0;
      }
      .hero2 > img {
        display: block;
        width: 100%;
        height: auto;
        animation: pop 0.9s var(--ease) both;
      }
      .hband {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        padding-top: 22px;
        color: var(--cream);
      }
      .hband p {
        margin: 0;
        font-size: clamp(17px, 2.4vw, 22px);
        font-weight: 700;
        max-width: 34em;
      }
      .btn-gold {
        background: var(--lgold);
        color: var(--brown);
      }
      .btn-gold:hover {
        transform: translateY(-2px);
        background: var(--cream);
      }
      .btn-out {
        border: 2.5px solid var(--lgold);
        color: var(--lgold);
      }
      .btn-out:hover {
        background: var(--lgold);
        color: var(--brown);
      }
      .menu {
        border-radius: 34px 34px 0 0;
        margin-top: -34px;
        position: relative;
        z-index: 2;
      }
      .card .img,
      .mhead,
      .ci .e {
        background-size: cover;
        background-position: center;
      }
      @media (min-width: 521px) {
        .card .img {
          height: 180px;
        }
      }
      .about .big {
        font-size: 0;
        height: 320px;
        border-radius: 42% 58% 55% 45%/50%;
        background-size: cover;
        background-position: center;
        box-shadow: 0 14px 0 #0004;
      }
      @media (max-width: 700px) {
        .about .big {
          height: 230px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>

  ${["sandwiches","shawerma","burgers"].includes(i.c) ? `<b>${t("size")}</b><div class="seg"><label><input type="radio" name="size" value="medium" checked>${t("medium")}</label><label><input type="radio" name="size" value="large">${t("large")}</label></div>` : ""}
  ${i.x ? `<b>${t("extras")}</b>${EXTRAS.map((x, k) => `<label class="opt"><span><input type="checkbox" value="${k}"><span class="opt-photo" role="img" aria-label="${S.lang === "ar" ? x.ar : x.en}" style="background-image:url(${x.e === "addon" ? ADDON_IMAGE : IMG[x.e]})"></span>${S.lang === "ar" ? x.ar : x.en}</span><span>+${money(x.p)}</span></label>`).join("")}` : ""}
  <label class="f">${t("notes")}<textarea id="mnote" rows="2"></textarea></label>
  <div style="display:flex;gap:12px;align-items:center"><div class="qty"><button data-d="-1" aria-label="-">−</button><span id="mq">1</span><button data-d="1" aria-label="+">+</button></div><button class="btn btn-dark" id="madd" style="flex:1">${t("add")} · <b></b></button></div></div>`;
        m.onclick = (e) => {
          const b = e.target.closest("button");
          if (e.target.closest("[data-close]")) return closeAll();
          if (b && b.dataset.d) {
            q = Math.max(1, q + +b.dataset.d);
            calc();
          }
          if (b && b.id === "madd") {
            const ex = calc(),
              note = m.querySelector("#mnote").value.trim(),
              size = m.querySelector('[name="size"]:checked')?.value || "medium",
              key = i.id + size + ex.join() + note,
              f = S.cart.find((l) => l.key === key);
            f ? (f.q += q) : S.cart.push({ key, id: i.id, q, ex, note, size });
            save();
            cartUI();
            closeAll();
            pulse();
          }
        };
        m.onchange = calc;
        calc();
        open(m);
      }
      function pulse() {
        const c = $("#cnt");
        c.animate([{ transform: "scale(1.6)" }, { transform: "scale(1)" }], {
          duration: 300,
        });
      }
      function cartUI() {
        const n = count();
        $("#cnt").textContent = n;
        const f = $("#fab");
        f.classList.toggle("has", n > 0);
        f.innerHTML = `<span>🛒 ${t("view")} (${n})</span><b>${money(subtotal())}</b>`;
        if ($("#drawer").classList.contains("on") || S.step !== "cart")
          drawer(true);
      }
      function summary() {
        return `<div class="row"><span>${t("sub")}</span><b>${money(subtotal())}</b></div><div class="row"><span>${t("del")}</span><span>${t("area")}</span></div><div class="row t"><span>${t("tot")}</span><span>${money(subtotal())}</span></div>`;
      }
      function drawer(keep) {
        const d = $("#drawer");
        let h = `<div class="dh"><h2 id="dt">${t("cart")}</h2><button data-close aria-label="close">✕</button></div>`;
        if (S.step === "cart") {
          h += S.cart.length
            ? `<div class="db">${S.cart
                .map((l, k) => {
                  const i = find(l.id);
                  return `<div class="ci"><div class="e" style="background-image:url(${IMG[i.e]})"></div><div><h4>${nm(i)}</h4><small>${l.size ? (l.size === "large" ? t("large") : t("medium")) + " · " : ""}${l.ex.map((x) => (S.lang === "ar" ? EXTRAS[x].ar : EXTRAS[x].en)).join("، ")} ${esc(l.note)}</small><b class="price">${money(lineP(l))}</b><br><button class="rm" data-rm="${k}">${t("rm")}</button></div><div class="qty"><button data-q="${k}" data-d="-1" aria-label="-">−</button><span>${l.q}</span><button data-q="${k}" data-d="1" aria-label="+">+</button></div></div>`;
                })
                .join(
                  "",
                )}</div><div class="df">${summary()}<button class="btn btn-dark" id="go">${t("co")}</button></div>`
            : `<div class="db"><p class="empty">${t("emptyc")}</p></div>`;
        } else if (S.step === "form") {
          h += `<div class="db"><label class="f">${t("name")} *<input class="in" id="fn" autocomplete="name" required></label><label class="f">${t("tel")} *<input class="in" id="fp" type="tel" autocomplete="tel" required></label><label class="f">${t("addr")} *<input class="in" id="fad" autocomplete="street-address" required></label>
    <div class="f"><b>${t("how")}</b><div class="seg"><label><input type="radio" name="m" value="pick" checked>${t("pick")}</label><label><input type="radio" name="m" value="deliv">${t("deliv")}</label></div></div>
    <label class="f">${t("onote")}<textarea id="fo" rows="2"></textarea></label><small>💵 ${t("pay")}</small><p id="err" style="color:#a00;margin:0;font-weight:700" role="alert"></p></div><div class="df">${summary()}<button class="btn btn-dark" id="sendo">${t("send")}</button></div>`;
        } else {
          const o = S.last;
          h += `<div class="db"><div class="ok"><div class="e">✅</div><h3 style="margin:0;color:var(--brown)">${t("done")}</h3><p style="margin:0">${t("num")}: <b>#${o.no}</b><br>${t("prep")}: ${CFG.prep} ${t("min")}</p></div>${o.lines.map((x) => `<div class="row"><span>${x}</span></div>`).join("")}<div class="row t"><span>${t("tot")}</span><span>${money(o.total)}</span></div><p style="margin:0">${esc(o.name)} · ${esc(o.phone)}</p><a class="btn btn-dark" target="_blank" rel="noopener" href="${o.wa}">💬 ${t("wam")}</a><button class="btn btn-line" data-close>${t("back")}</button></div>`;
        }
        d.innerHTML = h;
        if (!keep) open(d);
      }
      function order() {
        const n = $("#fn").value.trim(),
          p = $("#fp").value.trim(),
          dv = document.querySelector("[name=m]:checked").value === "deliv",
          a = $("#fad").value.trim();
        if (!n || !p) return ($("#err").textContent = t("need"));
        if (!a) return ($("#err").textContent = t("needa"));
        const lines = S.cart.map(
            (l) =>
              `${l.q} × ${nm(find(l.id))}${l.ex.length ? " (+" + l.ex.map((x) => (S.lang === "ar" ? EXTRAS[x].ar : EXTRAS[x].en)).join(", ") + ")" : ""}${l.note ? " — " + l.note : ""}`,
          ),
          total = subtotal(),
          no = Math.floor(1000 + Math.random() * 9000);
        const nt = $("#fo").value.trim();
        const msg = `${t("wnew")}\n\n${t("wn")}: ${n}\n${t("wp")}: ${p}\n\n${t("wo")}:\n${S.cart.map((l) => `${l.q} × ${nm(find(l.id))}${l.size ? " · " + (l.size === "large" ? t("large") : t("medium")) : ""}${l.ex.length ? "\n  + " + l.ex.map((x) => `${S.lang === "ar" ? EXTRAS[x].ar : EXTRAS[x].en} (${money(EXTRAS[x].p)})`).join(", ") : ""}${l.note ? "\n  " + t("notes") + ": " + l.note : ""}\n${money(lineP(l))}`).join("\n\n")}\n\n${t("tot")}:\n${money(total)}\n\n${t("how")}: ${dv ? t("deliv") : t("pick")}\n${t("wa2")}: ${a}\n\n${t("wnt")}: ${nt || "-"}\n#${no}`;
        S.last = {
          no,
          name: n,
          phone: p,
          lines,
          total,
          wa: `https://wa.me/${CFG.whatsapp.replace(/\D/g, "")}?text=${encodeURIComponent(msg)}`,
        };
        S.cart = [];
        S.step = "done";
        save();
        cartUI();
        drawer(true);
      }
      /* ===== events ===== */
      document.addEventListener("click", (e) => {
        const c = e.target.closest(".card,.popular-card");
        if (c) return product(c.dataset.id);
        const tb = e.target.closest(".tab");
        if (tb) {
          S.cat = tb.dataset.c;
          tabs();
          menu();
          return;
        }
        if (e.target.closest("[data-close]") || e.target.id === "scrim") {
          const fin = S.step === "done";
          closeAll();
          if (fin) S.step = "cart";
          return;
        }
        const r = e.target.closest("[data-rm]");
        if (r) {
          S.cart.splice(+r.dataset.rm, 1);
          save();
          return cartUI();
        }
        const qb = e.target.closest("[data-q]");
        if (qb) {
          const l = S.cart[+qb.dataset.q];
          l.q += +qb.dataset.d;
          if (l.q < 1) S.cart.splice(+qb.dataset.q, 1);
          save();
          return cartUI();
        }
        if (e.target.id === "go") {
          S.step = "form";
          return drawer(true);
        }
        if (e.target.id === "sendo") return order();
        if (e.target.closest("#cartBtn,#fab")) {
          S.step = "cart";
          return drawer();
        }
        if (e.target.closest("#lang")) {
          S.lang = S.lang === "ar" ? "en" : "ar";
          save();
          return chrome();
        }
        if (e.target.closest("#bg"))
          return $("#links").classList.toggle("open");
        if (e.target.closest(".links a")) $("#links").classList.remove("open");
      });
      document.addEventListener("change", (e) => {
        if (e.target.name === "m") $("#fa").hidden = e.target.value !== "deliv";
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeAll();
      });
      $("#q").addEventListener("input", (e) => {
        S.q = e.target.value;
        menu();
      });
      const hd = $("#hd");
      addEventListener(
        "scroll",
        () => {
          hd.classList.toggle("small", scrollY > 40);
        },
        { passive: true },
      );
      $("#heroimg").src = IMG.hero;
      $("#abimg").style.backgroundImage = `url(${IMG.plat})`;
      chrome();
    </script>
  </body>
</html>
